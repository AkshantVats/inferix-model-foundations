name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,hf]" || pip install -e ".[dev]" || pip install -e .
      - run: pip install ruff pytest
      - run: ruff check . --exclude build
      - run: pytest tests/ -v
